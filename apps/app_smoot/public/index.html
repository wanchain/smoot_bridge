  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      const loadFn = function() {
        const body_tag = document.body;
        const theme = localStorage.getItem('theme');
        let imgSrc, bg;
        if (theme === 'dark') {
          imgSrc = `${window.location.origin}/LoadingDark.png`;
          bg = '#042033';
        } else {
          imgSrc = `${window.location.origin}/LoadingLight.png`;
          bg = '#EBEFF2';
        }
        const imgDom = document.getElementById('loading-img');
        if (imgDom.src !== imgSrc) {
          imgDom.src = imgSrc;
          const divDom = document.getElementById('global-loading');
          divDom.style.background = bg;
        }
        // this.setAttribute('src', imgSrc);
      }
      window.onload = () => {
        localStorage.setItem('portfolioInfo', '');
        window.localStorage.setItem('priceInfo', '');
        window.localStorage.removeItem('allTokenList');
        const body_tag = document.body;
        const theme = localStorage.getItem('theme');
        if (!theme) return;
        body_tag.setAttribute('id', theme);
      }
    </script>
    <div id="global-loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #EBEFF2; display: flex; justify-content: center; align-items: center;">
      <img id="loading-img" src="/LoadingLight.png" onload="loadFn()" />
    </div>
